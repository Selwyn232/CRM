<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leaderboard · Robin Foundation</title>
  <link rel="icon" href="/img/logo.svg">
  <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/"><img src="/img/logo.svg" alt=""><div>Robin Foundation</div></a>
      <nav class="topnav"></nav>
      <a class="btn btn-quiet btn-sm" href="/login">Inloggen</a>
      <a class="btn btn-primary btn-sm" href="/portal#/doneren" data-ic="heart">Doneer</a>
    </div>
  </header>
  <main class="container">
    <section class="hero">
      <div class="eyebrow" data-ic="trophy">Leaderboard</div>
      <h1>Samen maken we het verschil</h1>
      <p>Dank aan alle donateurs. Wie liever anoniem blijft, verschijnt als “Anonieme donateur”; die giften tellen natuurlijk gewoon mee.</p>
      <div class="hero-stats" id="stats"></div>
    </section>
    <div class="kpis" id="cats" style="margin-bottom:16px"></div>
    <div class="card">
      <div class="card-head"><h2>Top donateurs</h2>
        <div class="toolbar">
          <div class="seg" id="f-period" role="tablist" aria-label="Periode">
            <button class="active" data-v="all">Altijd</button><button data-v="year">Dit jaar</button><button data-v="month">Deze maand</button>
          </div>
          <select id="f-cat" style="width:auto;height:32px;font-size:13.5px"><option value="">Alle bestemmingen</option></select>
        </div>
      </div>
      <div id="podium"></div>
      <div id="lb"></div>
    </div>
  </main>
  <script src="/js/icons.js"></script>
  <script src="/js/common.js"></script>
  <script>
    (async () => {
      const { api, esc, euro0, num } = RF;
      document.querySelectorAll('[data-ic]').forEach((el) => { el.insertAdjacentHTML('afterbegin', RF.icon(el.dataset.ic, 'icon-sm')); });
      document.getElementById('lb').innerHTML = RF.skeleton('rows');
      const [stats, cats] = await Promise.all([api('/api/public/stats'), api('/api/public/categories')]);
      document.getElementById('stats').innerHTML = `
        <div><div class="label">Opgehaald</div><div class="value">${euro0(stats.raised_cents)}</div></div>
        <div><div class="label">Al besteed</div><div class="value">${euro0(stats.spent_cents)}</div></div>
        <div><div class="label">Donateurs</div><div class="value">${num(stats.donors)}</div></div>
        <div><div class="label">Berichten van ontvangers</div><div class="value">${num(stats.messages)}</div></div>`;
      document.getElementById('cats').innerHTML = stats.categories.map((c) => `<div class="kpi">
        <div class="label">${RF.catIcon(c, 'sm')}${esc(c.name)}</div>
        <div class="value">${c.unit_label_plural ? num(c.units_spent) : euro0(c.spent_cents)}</div>
        <div class="sub">${c.unit_label_plural ? esc(c.unit_label_plural) + ' gefinancierd' : 'noodhulp verleend'}</div></div>`).join('');
      const sel = document.getElementById('f-cat');
      sel.innerHTML += cats.map((c) => `<option value="${esc(c.key)}">${esc(c.name)}</option>`).join('');
      let period = 'all';
      const nameHtml = (r) => (r.anonymous ? `<span class="anon">${RF.icon('eye-off', 'icon-sm')}${esc(r.name)}</span>` : esc(r.name));
      const load = async () => {
        const rows = await api(`/api/public/leaderboard?period=${period}&category=${sel.value}&limit=50`);
        const top = rows.slice(0, 3);
        const order = [top[1], top[0], top[2]];
        document.getElementById('podium').innerHTML = top.length >= 3 ? `<div class="podium">${order.map((r, i) => `<div class="p ${i === 1 ? 'first' : ''}">
          <span class="medal m${[2, 1, 3][i]}">${[2, 1, 3][i]}</span><div class="n lb-name" style="justify-content:center">${nameHtml(r)}</div><div class="a">${euro0(r.total_cents)}</div></div>`).join('')}</div>` : '';
        document.getElementById('lb').innerHTML = rows.length ? rows.map((r) => `<div class="lb-row">
          <div class="lb-rank">${r.rank <= 3 ? `<span class="medal m${r.rank}">${r.rank}</span>` : r.rank}</div>
          <div><div class="lb-name">${nameHtml(r)}</div><div class="lb-meta">${r.donation_count} ${r.donation_count === 1 ? 'gift' : 'giften'}${r.city ? ' · ' + esc(r.city) : ''}${r.messages ? ` · ${r.messages} ${r.messages === 1 ? 'bericht' : 'berichten'} ontvangen` : ''}</div></div>
          <div class="lb-amount">${euro0(r.total_cents)}</div></div>`).join('') : RF.emptyState({ icon: 'trophy', title: 'Nog geen donaties in deze periode' });
      };
      document.getElementById('f-period').onclick = (e) => {
        const b = e.target.closest('button'); if (!b) return;
        document.querySelectorAll('#f-period button').forEach((x) => x.classList.toggle('active', x === b));
        period = b.dataset.v; load();
      };
      sel.onchange = load;
      load();
    })();
  </script>
</body>
</html>
