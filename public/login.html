<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inloggen — Robin Foundation</title>
  <link rel="icon" href="/img/logo.svg">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="card auth-card login-card">
      <div class="brand"><img src="/img/logo.svg" alt=""></div>
      <h1>Welkom terug</h1>
      <p class="lead-c">Log in bij Robin Foundation</p>

      <p class="login-q">Ik ben een…</p>
      <div class="role-picker" role="radiogroup" aria-label="Kies hoe je inlogt">
        <button type="button" role="radio" data-role="donateur"><span class="ri" data-ic="heart"></span><b>Donateur</b><small>Volg je donaties</small></button>
        <button type="button" role="radio" data-role="ontvanger"><span class="ri" data-ic="heart-handshake"></span><b>Ontvanger</b><small>Kind, school of project</small></button>
        <button type="button" role="radio" data-role="medewerker"><span class="ri" data-ic="building-2"></span><b>Medewerker</b><small>Beheer &amp; CRM</small></button>
      </div>

      <div class="already hidden" id="already"></div>
      <form id="login-form" autocomplete="on">
        <div class="field">
          <label for="f-id" id="f-id-label">E-mailadres</label>
          <input id="f-id" name="id" type="email" required autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
        </div>
        <div class="field">
          <label for="f-pw">Wachtwoord</label>
          <input id="f-pw" name="password" type="password" required autocomplete="current-password">
        </div>
        <p class="form-error" hidden style="margin:0 0 12px"></p>
        <button class="btn btn-primary btn-lg btn-block" type="submit">Inloggen</button>
        <p class="small muted login-extra" data-for="donateur" style="text-align:center;margin-top:12px">
          Nog geen account? <a href="#" id="to-register">Account aanmaken</a></p>
        <p class="small muted login-extra" data-for="ontvanger" style="text-align:center;margin-top:12px">
          Geen account? Je begeleider of Robin Foundation maakt er een voor je aan.</p>
      </form>

      <form id="register-form" class="hidden">
        <h3 style="margin-top:4px">Account aanmaken als donateur</h3>
        <div class="field-row">
          <div class="field"><label>Voornaam</label><input name="first_name" type="text" required autocomplete="given-name"></div>
          <div class="field"><label>Achternaam</label><input name="last_name" type="text" autocomplete="family-name"></div>
        </div>
        <div class="field"><label>E-mailadres</label><input name="email" type="email" required autocomplete="email"></div>
        <div class="field"><label>Wachtwoord (min. 8 tekens)</label><input name="password" type="password" minlength="8" required autocomplete="new-password"></div>
        <label class="check"><input type="checkbox" name="show_on_leaderboard"> Toon mijn naam op het leaderboard (anders verschijn je als “Anonieme donateur”)</label>
        <label class="check"><input type="checkbox" name="newsletter" checked> Houd me op de hoogte via de nieuwsbrief</label>
        <p class="form-error" hidden style="margin:12px 0"></p>
        <button class="btn btn-primary btn-lg btn-block" style="margin-top:8px" type="submit">Account aanmaken</button>
        <p class="small" style="text-align:center;margin-top:12px"><a href="#" id="to-login">← Terug naar inloggen</a></p>
      </form>

      <div class="demo-hint" id="demo"></div>
      <p class="small muted" style="margin-top:12px;text-align:center"><a href="/">Home</a> · <a href="/leaderboard">Leaderboard</a></p>
    </div>
  </div>
  <script src="/js/icons.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
