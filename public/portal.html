<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mijn Robin Foundation</title>
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Robin Foundation">
  <meta name="application-name" content="Robin Foundation">
  <meta name="theme-color" content="#faf4e8">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app" class="hidden">
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="#/overzicht"><img src="/img/logo.png" alt=""><div>Robin Foundation</div></a>
        <nav class="topnav" id="nav">
          <a href="#/overzicht" data-route="overzicht">Overzicht</a>
          <a href="#/kinderen" data-route="kinderen">Mijn kinderen <span class="pill hidden" id="unread"></span></a>
          <a href="#/chat" data-route="chat">Chat <span class="pill hidden" id="chat-unread"></span></a>
          <a href="#/leaderboard" data-route="leaderboard">Leaderboard</a>
          <a href="#/profiel" data-route="profiel">Profiel</a>
          <a href="#" id="logout-m" class="mobile-only">Uitloggen</a>
        </nav>
        <a class="btn btn-primary btn-sm" href="#/sponsoren" id="donate-btn">Sponsor een kind</a>
        <button class="btn btn-quiet btn-sm desktop-only" id="logout">Uitloggen</button>
        <button class="nav-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false" aria-controls="nav"><span id="nav-toggle-ic"></span><span class="pill hidden" id="unread-m"></span></button>
      </div>
    </header>
    <main class="container" id="view"></main>
  </div>
  <script src="/js/icons.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/portal.js"></script>
</body>
</html>
