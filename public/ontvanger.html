<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robin Foundation — Ontvangers</title>
  <link rel="icon" href="/img/logo.svg">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="big-ui">
  <div id="auth" class="auth-wrap hidden">
    <div class="card auth-card">
      <div class="brand"><img src="/img/logo.svg" alt=""><div>Robin Foundation<small>Voor kinderen, scholen en projecten</small></div></div>
      <p class="muted" style="text-align:center">Log in om berichtjes te sturen naar de mensen die jou helpen.</p>
      <form id="login-form">
        <div class="field"><label for="r-user">Gebruikersnaam</label><input id="r-user" name="username" type="text" required autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"></div>
        <div class="field"><label for="r-pw">Wachtwoord</label><input id="r-pw" name="password" type="password" required autocomplete="current-password"></div>
        <p class="form-error" hidden style="margin:0 0 12px"></p>
        <button class="btn btn-primary" style="width:100%">Inloggen</button>
      </form>
      <div class="demo-hint">Demo: <b>grace</b> (kind, met begeleider) of <b>esperanza</b> (school) — wachtwoord <b>welkom123</b></div>
      <p class="small muted" style="margin-top:12px;text-align:center">Geen account? Je begeleider of Robin Foundation maakt er een voor je aan.</p>
    </div>
  </div>

  <div id="app" class="hidden">
    <header class="topbar">
      <div class="topbar-inner">
        <span class="brand"><img src="/img/logo.svg" alt=""><div>Robin Foundation<small id="who"></small></div></span>
        <nav class="topnav"></nav>
        <button class="btn btn-ghost btn-sm" id="pw-btn">Wachtwoord</button>
        <button class="btn btn-ghost btn-sm" id="logout">Uitloggen</button>
      </div>
    </header>
    <main class="container" id="view"></main>
  </div>
  <script src="/js/common.js"></script>
  <script src="/js/ontvanger.js"></script>
</body>
</html>
